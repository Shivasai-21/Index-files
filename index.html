<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFlix</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #141414;
      color: #fff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: #000;
    }
    header h1 {
      color: #e50914;
      font-size: 24px;
    }
    nav a {
      margin: 0 15px;
      color: #fff;
      text-decoration: none;
    }
    .hero {
      position: relative;
      background: url('banner.jpg') no-repeat center center/cover;
      height: 60vh;
      display: flex;
      align-items: center;
      padding: 40px;
    }
    .hero-content {
      max-width: 500px;
    }
    .hero h2 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .hero button {
      background-color: #e50914;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    .row {
      padding: 20px;
    }
    .row h3 {
      margin-bottom: 10px;
    }
    .movies {
      display: flex;
      overflow-x: scroll;
    }
    .movies img {
      width: 200px;
      margin-right: 10px;
      border-radius: 4px;
      transition: transform 0.3s;
    }
    .movies img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>MyFlix</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">My List</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>Featured Movie</h2>
      <p>Watch the latest blockbuster now.</p>
      <button>Play</button>
      <button>More Info</button>
    </div>
  </section>

  <section class="row">
    <h3>Popular on MyFlix</h3>
    <div class="movies">
      <img src="movie1.jpg" alt="Movie 1">
      <img src="movie2.jpg" alt="Movie 2">
      <img src="movie3.jpg" alt="Movie 3">
      <img src="movie4.jpg" alt="Movie 4">
    </div>
  </section>

  <section class="row">
    <h3>Trending Now</h3>
    <div class="movies">
      <img src="movie5.jpg" alt="Movie 5">
      <img src="movie6.jpg" alt="Movie 6">
      <img src="movie7.jpg" alt="Movie 7">
      <img src="movie8.jpg" alt="Movie 8">
    </div>
  </section>
</body>
</html>
