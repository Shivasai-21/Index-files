name: Inputs Demo

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 Bucket Name'
        required: true
        default: 'shivasai.devops.s3bucket'
      region:
        description: 'AWS Region'
        required: true
        default: 'ap-south-1'
        type: choice
        options:
          - 'ap-south-1'
          - 'us-east-1'
          - 'us-west-1'
          - 'us-west-2'
          - 'eu-west-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: ${{ github.event.inputs.bucket_name }}
      AWS_REGION: ${{ github.event.inputs.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create S3 bucket (if not exists)
        run: |
          aws s3 mb s3://${BUCKET_NAME} --region ${AWS_REGION} || echo "Bucket already exists"

      - name: Upload static website files to S3
        run: |
          aws s3 sync ./website s3://${BUCKET_NAME} --acl public-read

      - name: Enable static website hosting
        run: |
          aws s3 website s3://${BUCKET_NAME} \
            --index-document index.html \
            --error-document error.html

      - name: Output website URL
        run: |
          echo "Static website is hosted at http://${BUCKET_NAME}.s3-website-${AWS_REGION}.amazonaws.com"
